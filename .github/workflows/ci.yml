name: AbogadosSJ CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Automated tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Full dependency audit
        run: node .github/scripts/check-npm-audit.mjs

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql://ci_user:ci_password@127.0.0.1:5432/abogadossj_ci" >> "$GITHUB_ENV"
          printf 'JWT_SECRETS=ci:%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")" >> "$GITHUB_ENV"
          echo "JWT_CURRENT_KID=ci" >> "$GITHUB_ENV"
          echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build Next.js production
        run: npm run build

  postgres_integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abogadossj_it
          POSTGRES_PASSWORD: ci_only_postgres_test
          POSTGRES_DB: abogadossj_it
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U abogadossj_it -d abogadossj_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://abogadossj_it:ci_only_postgres_test@127.0.0.1:5434/abogadossj_it
      RUN_POSTGRES_INTEGRATION: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify isolated database destination
        run: |
          node <<'NODE'
          const url = new URL(process.env.DATABASE_URL);

          const safe =
            url.protocol === 'postgresql:' &&
            url.hostname === '127.0.0.1' &&
            url.port === '5434' &&
            url.username === 'abogadossj_it' &&
            url.pathname === '/abogadossj_it';

          if (!safe) {
            throw new Error('Destino PostgreSQL no autorizado');
          }

          console.log('Destino PostgreSQL de integración verificado.');
          NODE

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Run PostgreSQL integration tests
        run: npx vitest run tests/integration.postgres.spec.ts tests/integration.auth-sessions.spec.ts

  playwright_e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abogadossj_it
          POSTGRES_PASSWORD: ci_only_playwright_test
          POSTGRES_DB: abogadossj_it
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U abogadossj_it -d abogadossj_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://abogadossj_it:ci_only_playwright_test@127.0.0.1:5434/abogadossj_it
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure isolated JWT keys
        shell: bash
        run: |
          echo "JWT_CURRENT_KID=e2e" >> "$GITHUB_ENV"
          printf 'JWT_SECRETS=e2e:%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")" >> "$GITHUB_ENV"

      - name: Apply isolated PostgreSQL migrations
        run: npx prisma migrate deploy

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
